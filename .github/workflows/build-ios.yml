name: Build iOS IPA

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Compile iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Prebuild native iOS project
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        run: |
          cd ios
          pod install
          cd ..

      - name: Compile Xcode project
        run: |
          WORKSPACE=$(find ios -name "*.xcworkspace" | head -n 1)
          # Find the main app scheme, ignoring CocoaPods and test schemes
          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list -json | node -e '
            const data = JSON.parse(require("fs").readFileSync(0, "utf-8"));
            const schemes = data.workspace.schemes;
            console.error("All schemes found:", schemes.join(", "));
            const mainScheme = schemes.find(s => !s.startsWith("Pods-") && !s.includes("Test") && !s.includes("Pods")) || schemes[0];
            console.error("Selected scheme:", mainScheme);
            process.stdout.write(mainScheme);
          ')
          echo ""
          echo "Building workspace: $WORKSPACE with scheme: $SCHEME"
          
          mkdir -p build/output
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CONFIGURATION_BUILD_DIR="$PWD/build/output" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package into IPA
        run: |
          echo "=== Contents of build/output ==="
          ls -la build/output/
          
          APP_PATH=$(find build/output -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Searching whole build directory:"
            APP_PATH=$(find build -name "*.app" -type d | head -n 1)
          fi
          
          echo "Selected app bundle: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qr engwe-speed-tool.ipa Payload
          ls -lh engwe-speed-tool.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: engwe-speed-tool-ipa
          path: engwe-speed-tool.ipa
          retention-days: 14
