name: Build iOS IPA

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Compile iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Prebuild native iOS project
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        run: |
          cd ios
          pod install
          cd ..

      - name: Compile Xcode project
        run: |
          # Find the main project xcodeproj in ios/ (ignoring ios/Pods)
          XCODEPROJ=$(find ios -maxdepth 1 -name "*.xcodeproj" | head -n 1)
          SCHEME=$(basename "$XCODEPROJ" .xcodeproj)
          WORKSPACE=$(find ios -maxdepth 1 -name "*.xcworkspace" | head -n 1)
          
          echo "=== Build Target Info ==="
          echo "Main App Scheme: $SCHEME"
          echo "Workspace: $WORKSPACE"
          
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package into IPA
        run: |
          echo "=== Locating built .app bundle ==="
          APP_PATH=$(find build -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Searching Library DerivedData fallback:"
            APP_PATH=$(find /Users/runner/Library/Developer/Xcode/DerivedData -name "*.app" -type d | head -n 1)
          fi
          
          echo "Found app bundle at: $APP_PATH"
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "ERROR: No .app bundle found!"
            exit 1
          fi
          
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qr engwe-speed-tool.ipa Payload
          ls -lh engwe-speed-tool.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: engwe-speed-tool-ipa
          path: engwe-speed-tool.ipa
          retention-days: 14
